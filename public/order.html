<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order — KVANN TOP UP</title><link rel="stylesheet" href="/style.css"></head><body><header class="header"><nav class="nav"><a class="brand" href="/"><img src="/assets/logo.svg"><span>KVANN TOP UP</span></a><div class="navlinks"><a href="/">Store</a><a href="/orders.html">Orders</a></div></nav></header><main class="container"><a href="/" class="muted">← Store</a><div id="root" style="margin-top:15px"></div></main><div id="toast" class="toast"></div><script src="/app.js"></script><script>
const code=new URLSearchParams(location.search).get('code');async function load(){const o=await api('/api/orders/'+encodeURIComponent(code));$('#root').innerHTML=`<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2>Order ${o.order_code}</h2><p class="muted">${o.game_name} • ${o.product_name}</p></div><span class="status ${o.status.toLowerCase()}">${o.status}</span></div><div class="order-box"><div><p>Player ID: <b>${o.player_id}</b></p><p>Server ID: <b>${o.server_id||'-'}</b></p><p>Amount: <b class="price">${Number(o.amount).toFixed(2)} ${o.currency}</b></p><p>Payment: <span class="status ${o.payment_status.toLowerCase()}">${o.payment_status}</span></p>${o.payment_status!=='PAID'?'<button id="check" class="btn">ខ្ញុំបានបង់រួច / Check Payment</button><p class="muted" style="font-size:12px">Scan KHQR រួចចុច Check Payment។</p>':'<div class="panel"><h3>✅ Payment Confirmed</h3><p>Order កំពុងរង់ចាំ Top-Up</p></div>'}</div><div>${o.payment_status==='PAID'?'':`<div class="qr"><img src="${o.khqr_image}" alt="KHQR"></div>${o.deeplink?`<p style="text-align:center"><a class="btn" href="${o.deeplink}">Open in Bakong</a></p>`:''}`}</div></div></div>`;const c=$('#check');if(c)c.onclick=async()=>{try{await api('/api/orders/'+encodeURIComponent(code)+'/check-payment',{method:'POST'});toast('បានពិនិត្យ Payment');load()}catch(e){toast(e.message)}}}load().catch(e=>{if(e.message==='LOGIN_REQUIRED')location.href='/login.html';else toast(e.message)});
</script></body></html>
