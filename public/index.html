<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KVANN TOP UP</title><link rel="stylesheet" href="/style.css"></head><body><header class="header"><nav class="nav"><a class="brand" href="/"><img src="/assets/logo.svg"><span>KVANN TOP UP</span></a><div class="navlinks"><a href="/orders.html">Orders</a><a href="/login.html" id="loginLink">Login</a><button id="logoutBtn" style="display:none">Logout</button></div></nav></header><main class="container"><section class="hero"><div class="hero-copy"><span class="hero-badge">⚡ FAST & SECURE</span><h1>KVANN TOP UP<br><span>GAMING</span></h1><p>Game Top-Up រហ័ស • KHQR Payment • Order Tracking</p></div></section><section class="security"><div class="pill"><span class="pill-icon">⚡</span><div><b>មកដល់រហ័ស</b><br><small>Fast Top-Up</small></div></div><div class="pill"><span class="pill-icon">🛡️</span><div><b>សុវត្ថិភាព 100%</b><br><small>KHQR Verified Payment</small></div></div></section><div class="section-head"><div><h2>DIRECT TOP-UPS</h2><div class="under"></div></div></div><input id="search" class="search" placeholder="🔎 ស្វែងរក Game..."><section id="games" class="games"></section></main><footer>KVANN TOP UP • Game Top-Up Store • © 2026</footer><div id="toast" class="toast"></div><script src="/app.js"></script><script>
(async()=>{const user=await me();if(user){$('#loginLink').style.display='none';$('#logoutBtn').style.display='block';$('#logoutBtn').onclick=logout}const load=async q=>{const gs=await api('/api/games?q='+encodeURIComponent(q||''));$('#games').innerHTML=gs.map(g=>`<article class="card" onclick="location.href='/game.html?slug=${encodeURIComponent(g.slug)}'"><div class="card-img"><img src="${g.image}"><span class="flag">${g.region||'🌏'}</span></div><div class="card-body">${g.name}</div></article>`).join('')};load('');$('#search').oninput=e=>load(e.target.value)})().catch(e=>toast(e.message));
</script></body></html>
