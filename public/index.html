<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KVANN TOP UP — Game Top-Up Store</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="header">
  <nav class="nav">
    <a class="brand" href="/"><img src="/assets/logo.svg" alt="KVANN TOP UP"><span>KVANN TOP UP</span></a>
    <div class="navlinks">
      <a href="/" class="active">Home</a>
      <a href="#games">Games</a>
      <a href="#games">Top Up</a>
      <a href="/orders.html">Orders</a>
      <a href="/login.html" id="loginLink">Login</a>
      <button id="logoutBtn" style="display:none">Logout</button>
    </div>
  </nav>
</header>

<main class="container">
  <section class="hero-new">
    <a href="#games" aria-label="Top Up Now">
      <img src="/assets/kvann-3-games-banner.png" alt="KVANN TOP UP - Free Fire, Mobile Legends, PUBG Mobile">
    </a>
  </section>

  <section class="security">
    <div class="pill"><span>⚡</span><div><b>FAST TOP-UP</b><small>រហ័សទាន់ចិត្ត</small></div></div>
    <div class="pill"><span>🛡️</span><div><b>SECURE &amp; SAFE</b><small>សុវត្ថិភាព 100%</small></div></div>
    <div class="pill"><span>🎧</span><div><b>24/7 SUPPORT</b><small>ជួយគ្រប់ពេល</small></div></div>
    <div class="pill"><span>💎</span><div><b>BEST PRICE</b><small>តម្លៃសមរម្យ</small></div></div>
  </section>

  <section id="games" class="games-section">
    <div class="section-head">
      <h2>POPULAR GAMES</h2>
      <span>3 GAMES</span>
    </div>
    <div id="gamesGrid" class="games-grid"></div>
  </section>
</main>

<script>
const wanted = [
  {keys:['free fire','freefire'], name:'Free Fire', img:'/assets/free-fire-card.png'},
  {keys:['mobile legends','mlbb'], name:'Mobile Legends', img:'/assets/mobile-legends-card.png'},
  {keys:['pubg mobile','pubg'], name:'PUBG Mobile', img:'/assets/pubg-mobile-card.png'}
];

function pickGame(g){
  const n=(g.name||'').toLowerCase();
  return wanted.find(x=>x.keys.some(k=>n.includes(k)));
}

async function loadGames(){
  const grid=document.getElementById('gamesGrid');
  try{
    const r=await fetch('/api/games');
    const all=await r.json();
    const selected=wanted.map(w=>all.find(g=>pickGame(g)?.name===w.name)).map((g,i)=>g||wanted[i]);
    grid.innerHTML=selected.map((g,i)=>{
      const w=wanted[i];
      const slug=g.slug || w.name.toLowerCase().replace(/\s+/g,'-');
      const img=g.image || w.img;
      return `<article class="game-card" onclick="location.href='/game.html?slug=${encodeURIComponent(slug)}'">
        <img src="${img}" alt="${w.name}">
        <div class="game-info"><b>${w.name}</b><span>TOP UP NOW →</span></div>
      </article>`;
    }).join('');
  }catch(e){
    grid.innerHTML=wanted.map(w=>`<article class="game-card" onclick="location.href='/game.html?slug=${encodeURIComponent(w.name.toLowerCase().replace(/\s+/g,'-'))}'"><img src="${w.img}" alt="${w.name}"><div class="game-info"><b>${w.name}</b><span>TOP UP NOW →</span></div></article>`).join('');
  }
}
loadGames();
</script>
</body>
</html>
