<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - KVANN TOP UP</title><link rel="stylesheet" href="/style.css"></head><body><header class="header"><nav class="nav"><a class="brand" href="/"><img src="/assets/logo.svg"><span>KVANN TOP UP ADMIN</span></a><button class="btn secondary" onclick="logout()">Logout</button></nav></header><main class="container"><div class="admin-grid" id="stats"></div><div class="section-head"><div><h2>Orders</h2><div class="under"></div></div><button class="btn" onclick="load()">Refresh</button></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Game / Package</th><th>Player</th><th>Amount</th><th>Payment</th><th>Status</th><th>Action</th></tr></thead><tbody id="orders"></tbody></table></div><div class="section-head"><div><h2>Add Game / Package</h2><div class="under"></div></div></div><div class="checkout-grid"><form class="panel" id="gameForm"><h3>Add Game</h3><div class="field"><label>Slug</label><input name="slug" required></div><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Category</label><input name="category"></div><div class="field"><label>Region</label><input name="region" placeholder="🇰🇭"></div><button class="btn">Create Game</button></form><form class="panel" id="productForm"><h3>Add Package</h3><div class="field"><label>Game</label><select name="gameId" id="gameSelect"></select></div><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Amount text</label><input name="amount" required placeholder="100 Diamonds"></div><div class="field"><label>Price</label><input name="price" type="number" step="0.01" required></div><div class="field"><label>Currency</label><select name="currency"><option>USD</option><option>KHR</option></select></div><button class="btn">Create Package</button></form></div></main><div id="toast" class="toast"></div><script src="/app.js"></script><script>
async function load(){const [s,os]=await Promise.all([api('/api/admin/stats'),api('/api/admin/orders')]);$('#stats').innerHTML=[['Orders',s.totalOrders],['Paid',s.paidOrders],['Revenue',Number(s.revenue).toFixed(2)],['Customers',s.customers]].map(x=>`<div class="stat"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('');$('#orders').innerHTML=os.map(o=>`<tr><td><b>${o.order_code}</b></td><td>${o.customer_name}<br><small>${o.customer_email}</small></td><td>${o.game_name}<br>${o.product_name}</td><td>${o.player_id}${o.server_id?'<br>'+o.server_id:''}</td><td>${Number(o.amount).toFixed(2)} ${o.currency}</td><td>${o.payment_status}</td><td><span class="status">${o.status}</span></td><td><select onchange="setStatus(${o.id},this.value)"><option value="">Change</option><option>PROCESSING</option><option>COMPLETED</option><option>CANCELLED</option><option>REFUNDED</option></select></td></tr>`).join('');const gs=await api('/api/admin/games');$('#gameSelect').innerHTML=gs.map(g=>`<option value="${g.id}">${g.name}</option>`).join('')}
async function setStatus(id,status){if(!status)return;try{await api('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status,fulfillmentStatus:status==='COMPLETED'?'FULFILLED':undefined})});toast('Updated');load()}catch(e){toast(e.message)}}
$('#gameForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/games',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast('Game created');e.target.reset();load()}catch(e){toast(e.message)}};
$('#productForm').onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.target));x.gameId=Number(x.gameId);await api('/api/admin/products',{method:'POST',body:JSON.stringify(x)});toast('Package created');e.target.reset();load()}catch(e){toast(e.message)}};
me().then(u=>{if(!u||u.role!=='admin')location.href='/login.html';else load()}).catch(()=>location.href='/login.html');
</script></body></html>
