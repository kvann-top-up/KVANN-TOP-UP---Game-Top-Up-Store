<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - KVANN TOP UP</title><link rel="stylesheet" href="/style.css"></head><body><main class="container"><div class="auth-wrap"><div class="panel"><a class="brand" href="/"><img src="/assets/logo.svg"><span>KVANN TOP UP</span></a><h2>បង្កើតគណនី</h2><form id="f"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password (6+ characters)</label><input name="password" type="password" minlength="6" required></div><button class="btn full">Register</button></form><p class="muted">មានគណនីហើយ? <a href="/login.html" style="color:#39e77b">Login</a></p></div></div></main><div id="toast" class="toast"></div><script src="/app.js"></script><script>$('#f').onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.target));await api('/api/auth/register',{method:'POST',body:JSON.stringify(x)});location.href='/'}catch(e){toast(e.message)}};</script></body></html>
