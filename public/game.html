<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game - KVANN TOP UP</title><link rel="stylesheet" href="/style.css"></head><body><main class="container"><a href="/" class="back-link">← Back to Games</a><div id="root" style="margin-top:15px"></div></main><div id="toast" class="toast"></div><script src="/app.js"></script><script>
(async()=>{const slug=new URLSearchParams(location.search).get('slug');const gs=await api('/api/games');const g=gs.find(x=>x.slug===slug);if(!g)return $('#root').innerHTML='<div class="panel">Game not found</div>';$('#root').innerHTML=`<div class="checkout-grid"><div class="panel game-preview"><img src="${g.image}" style="width:100%;border-radius:18px"><span class="eyebrow">GAME TOP-UP</span><h1>${g.name}</h1><p class="muted">${g.category||''} ${g.region||''}</p><div class="game-note">⚡ Fast delivery • 🛡️ Secure payment</div></div><div class="panel"><span class="eyebrow">SELECT PACKAGE</span><h2>ជ្រើស Package</h2><div id="packages"></div><form id="orderForm" style="display:none"><div class="field"><label>Player ID</label><input name="playerId" required placeholder="123456789"></div><div class="field"><label>Server ID (if required)</label><input name="serverId" placeholder="1234"></div><div class="field"><label>Note</label><textarea name="customerNote" rows="3"></textarea></div><button class="btn full">បន្តទៅបង់ប្រាក់</button></form></div></div>`;let selected=null;$('#packages').innerHTML=g.products.map(p=>`<button class="btn secondary package-btn" style="width:100%;margin-bottom:9px;text-align:left" data-id="${p.id}"><b>${p.name}</b><span style="float:right">${p.price.toFixed(2)} ${p.currency}</span></button>`).join('');$$('#packages button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;$$('#packages button').forEach(x=>x.style.outline='none');b.style.outline='2px solid #fff';$('#orderForm').style.display='block'});$('#orderForm').onsubmit=async e=>{e.preventDefault();try{const x=Object.fromEntries(new FormData(e.target));x.productId=Number(selected);const u=await me();if(!u)return location.href='/login.html';const o=await api('/api/orders',{method:'POST',body:JSON.stringify(x)});location.href='/order.html?code='+encodeURIComponent(o.order_code)}catch(e){toast(e.message)}}})().catch(e=>toast(e.message));
</script></body></html>
